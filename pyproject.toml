[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deep-research-assistant"
version = "0.3.0"
description = "A general-purpose, traceable deep research agent powered by Hy3 and LangGraph."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "langchain-core>=0.3.72",
  "langchain-mcp-adapters>=0.1.9",
  "langchain-openai>=0.3.28",
  "langgraph>=1.0.0",
  "langgraph-cli[inmem]>=0.3.1",
  "langgraph-checkpoint-postgres>=3.0.0",
  "langgraph-checkpoint-sqlite>=3.0.0",
  "langgraph-sdk>=0.4.0",
  "langsmith>=0.4.8",
  "openai>=1.68.0",
  "pymupdf>=1.25.3",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "psycopg[binary,pool]>=3.2.0",
  "sqlalchemy>=2.0.0",
  "tavily-python>=0.7.12",
  "typer>=0.15.0",
  "typing-extensions>=4.12.0",
  "uvicorn>=0.34.0",
  "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.9.0",
]

[project.scripts]
deep-research-assistant = "deep_research_assistant.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_research_assistant"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
